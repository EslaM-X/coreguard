# =============================================================================
# deploy/nginx.conf — reference reverse proxy for the CoreGuard DDE endpoint.
#
# READY-TO-USE posture for "Running behind a reverse proxy" as documented in
# docs/delivery-dispute-boundary.md — and CONTRACT-BOUND to it: a structural
# test fails the push when this file drifts from the documented directives
# (or the doc from this file), in either direction:
#   test/ci/nginx-conf-contract.test.js
#
# What this conf encodes (all rules from the doc's production posture):
#   - TLS terminates here; the app speaks plain HTTP over loopback only
#   - per-client rate limiting at the edge; the app's own limiter stays as a
#     backstop sized ABOVE this ceiling (rateLimit: { windowMs: 60000, max: 600 })
#   - edge body cap ≤ the app's 1 MiB cap so oversize dies at the proxy
#   - X-Forwarded-For is forwarded for downstream LOGGING (and, with the app's
#     OPTIONAL trustedForwarders arm, classification input) — never identity:
#     every guard on the app keys on the direct peer, which is this proxy
#   - the allowlist arm (allowAddresses) and the optional classification arm
#     (trustedForwarders) live on the APP's start line — see the boundary doc
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # per real client, before the request ever reaches the app
    limit_req_zone $binary_remote_addr zone=dde:10m rate=10r/s;

    server {
        listen 443 ssl;

        # Deployment-specific (placeholders): point at your own certificates.
        # nginx refuses to start on missing files — a deliberate, honest
        # failure rather than a silent plaintext fallback.
        ssl_certificate     /etc/nginx/ssl/dde.crt;
        ssl_certificate_key /etc/nginx/ssl/dde.key;

        location / {
            limit_req zone=dde burst=20 nodelay;
            # keep the edge cap ≤ the app's 1 MiB (MAX_BODY_BYTES)
            client_max_body_size 1m;
            proxy_pass http://127.0.0.1:8787;
            proxy_set_header Host $host;
            # X-Forwarded-For is LOGGING data (and, with the app's optional
            # trustedForwarders arm, classification input) — never identity
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
