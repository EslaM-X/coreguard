[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"

[fmt]
line_length = 100
tab_width = 2

[rpc_endpoints]
core_testnet2 = "https://rpc.test2.btcs.network"
core_testnet2_archive = "https://rpcar.test2.btcs.network"
core_mainnet = "https://rpc.coredao.org"