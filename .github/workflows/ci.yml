name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (node)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Supported-LTS runtimes only (owner decision, 2026-11-04): Node 18
        # (EOL 2025-04) and Node 20 (EOL 2026-04) are retired. Node 18 kept
        # failing CI with a silent mid-suite child abort (run 41871078359:
        # buffered TAP ends mid-line at "# Subtest: perf", no `not ok`, no
        # summary, exit 1) while the same suite CLONE passes to completion on
        # the same node:18 image in a local container — plus a long history of
        # node18-specific CI lies (AGENTS.md C20/C28/C31: SIGTERM with no
        # output, ESM/CJS detection, import.meta.dirname). A security product
        # does not certify an unsupported runtime it cannot reproduce.
        node-version: [22, 24]
    steps:
      # fetch-depth: 0 is load-bearing: the commit-anchored freeze verifier
      # (validate-freeze.mjs, exercised by test/verifier-c) hashes pinned files
      # from its gitCommit anchor via git show. A shallow clone cannot resolve
      # that historical commit, so the verifier fails closed and the suite goes
      # red on every push. Full history also lets CI reproduce the clean-clone
      # verification the freeze record promises.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The lockfile guard MUST run before actions/setup-node: with `cache: npm`,
      # setup-node fails opaque ("Dependencies lock file is not found") the
      # moment package-lock.json is absent. Red run 34440426922 (commit 41ed0b4)
      # died there — the post-setup-node guard could never fire first.
      - name: Guard - lockfile present + workspace sync (before setup-node)
        run: node scripts/check-lock-sync.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Guard - workflow YAML (zero-jobs trap)
        run: node scripts/check-workflows.mjs
      - run: npm ci
      - name: Release gate self-audit (no test run — the gate auditing its own source)
        run: npm run release:gate:independence
      - run: npm test
      - run: npm run corpus
      - run: npm run benchmark
      - run: npm run benchmark:10k
      - run: npm run mutation
      - name: Publish gate — 13 @coreguard packages install-verified from packed tarballs
        run: npm run publish:check
      - name: Offline commitment recompute matches fixture (pristine checkout)
        run: |
          node scripts/compute-commitment.mjs --receipt examples/transfer/receipt-valid.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);if(p.receiptId!=='0xd4ddd02204f55662ef7db62b7a720c7e8dbff8d92a1cc621df22cf1b5dc22627'){console.error('receiptId mismatch: '+p.receiptId);process.exit(1)}console.log('offline recompute OK: '+p.commitment)})"
      - name: CoreGuard receipt verification via composite action
        uses: ./.github/actions/coreguard-verify
        with:
          receipt: examples/transfer/receipt-valid.json
          intent: examples/transfer/intent.json
          policy: examples/transfer/policy.json
          trace: examples/transfer/trace.json
          chainId: "1114"

  contracts:
    name: Contracts (foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build
      - name: EvidenceRegistryV2 (forge test)
        run: forge test --match-path "test/contract/*"

  demos:
    name: Demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard - lockfile present + workspace sync (before setup-node)
        run: node scripts/check-lock-sync.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node examples/transfer/run-demo.js
      - run: node examples/swap/run-demo.js
      - run: node examples/multistep/run-demo.js
      - name: Reference Vault ladder (allow) — ALLOW → VERIFIED → anchor
        run: node examples/vault/vault-demo.mjs --allow
      - name: Reference Vault ladder (attack) — six attacks BLOCKED
        run: node examples/vault/vault-demo.mjs --attack
      - name: Offline verifier sanity (no RPC)
        run: node packages/cli/src/index.js verify --receipt examples/transfer/receipt-valid.json --intent examples/transfer/intent.json --policy examples/transfer/policy.json --trace examples/transfer/trace.json  # The DDE evidence cycle moved to its own badge-visible workflow:
  # .github/workflows/dde.yml (same steps verbatim + the fuzz mode).
  # Workflow files themselves are gated by test/ci/workflow-yaml-contract.test.js
  # (real-YAML parse + Actions schema walk): an unparseable or schema-deviant
  # file fails the push locally before GitHub ever builds the run.
