name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (node)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      # fetch-depth: 0 is load-bearing: the commit-anchored freeze verifier
      # (validate-freeze.mjs, exercised by test/verifier-c) hashes pinned files
      # from its gitCommit anchor via git show. A shallow clone cannot resolve
      # that historical commit, so the verifier fails closed and the suite goes
      # red on every push. Full history also lets CI reproduce the clean-clone
      # verification the freeze record promises.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm test
      - run: npm run corpus
      - run: npm run benchmark
      - run: npm run benchmark:10k
      - run: npm run mutation
      - name: Offline commitment recompute matches fixture (pristine checkout)
        run: |
          node scripts/compute-commitment.mjs --receipt examples/transfer/receipt-valid.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);if(p.receiptId!=='0xd4ddd02204f55662ef7db62b7a720c7e8dbff8d92a1cc621df22cf1b5dc22627'){console.error('receiptId mismatch: '+p.receiptId);process.exit(1)}console.log('offline recompute OK: '+p.commitment)})"
      - name: CoreGuard receipt verification via composite action
        uses: ./.github/actions/coreguard-verify
        with:
          receipt: examples/transfer/receipt-valid.json
          intent: examples/transfer/intent.json
          policy: examples/transfer/policy.json
          trace: examples/transfer/trace.json
          chainId: "1114"

  contracts:
    name: Contracts (foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build
      - name: EvidenceRegistryV2 (forge test)
        run: forge test --match-path "test/contract/*"

  demos:
    name: Demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node examples/transfer/run-demo.js
      - run: node examples/swap/run-demo.js
      - run: node examples/multistep/run-demo.js
      - name: Reference Vault ladder (allow) — ALLOW → VERIFIED → anchor
        run: node examples/vault/vault-demo.mjs --allow
      - name: Reference Vault ladder (attack) — six attacks BLOCKED
        run: node examples/vault/vault-demo.mjs --attack
      - name: Offline verifier sanity (no RPC)
        run: node packages/cli/src/index.js verify --receipt examples/transfer/receipt-valid.json --intent examples/transfer/intent.json --policy examples/transfer/policy.json --trace examples/transfer/trace.json