name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (node)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: npm run corpus
      - run: npm run benchmark

  contracts:
    name: Contracts (foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge --version
      - run: forge build

  demos:
    name: Demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: node examples/transfer/run-demo.js
      - run: node examples/swap/run-demo.js
      - run: node examples/multistep/run-demo.js
      - name: Offline verifier sanity (no RPC)
        run: node packages/cli/src/index.js verify --receipt examples/transfer/receipt-valid.json --intent examples/transfer/intent.json --policy examples/transfer/policy.json --trace examples/transfer/trace.json
      - name: Offline commitment recompute matches fixture
        run: node scripts/compute-commitment.mjs --receipt examples/transfer/receipt-valid.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const p=JSON.parse(d);if(p.receiptId!=='0xd4ddd02204f55662ef7db62b7a720c7e8dbff8d92a1cc621df22cf1b5dc22627'){console.error('receiptId mismatch: '+p.receiptId);process.exit(1)}console.log('offline recompute OK: '+p.commitment)})"