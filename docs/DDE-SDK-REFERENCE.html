<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreGuard DDE — SDK Reference</title>
<style>
  :root{
    --bg:#0b1420; --panel:#101d2e; --panel2:#0d1826; --line:#22354d;
    --ink:#e8eef6; --muted:#93a4ba; --green:#34d399; --red:#f87171;
    --amber:#fbbf24; --blue:#60a5fa; --violet:#a78bfa;
    --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,'Segoe UI',sans-serif; padding-bottom:70px}
  .wrap{max-width:1060px; margin:0 auto; padding:0 20px}
  a{color:var(--blue)}
  .ltr{direction:ltr; unicode-bidi:isolate; font-family:var(--mono)}
  header{padding:34px 0 18px; border-bottom:1px solid var(--line)}
  h1{font-size:26px; letter-spacing:.2px}
  .sub{color:var(--muted); margin-top:6px; max-width:780px}
  nav{position:sticky; top:0; z-index:9; background:rgba(11,20,32,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line)}
  nav .wrap{display:flex; gap:4px; align-items:center; flex-wrap:wrap; padding:8px 20px}
  nav a{color:var(--muted); text-decoration:none; font-size:13px; padding:5px 10px; border-radius:7px}
  nav a:hover{color:var(--ink); background:var(--panel)}
  #langBtn{margin-inline-start:auto; background:var(--panel); border:1px solid var(--line); color:var(--ink); font:600 13px system-ui; padding:5px 14px; border-radius:7px; cursor:pointer}
  #langBtn:hover{border-color:var(--blue)}
  section{padding:34px 0 6px}
  h2{font-size:19px; margin-bottom:14px; padding-inline-start:11px; border-inline-start:3px solid var(--blue)}
  .grid{display:grid; gap:14px}
  .g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
  .card h3{font-size:14.5px; margin-bottom:8px}
  .card .d{color:var(--muted); font-size:13.5px}
  .mono,pre{font-family:var(--mono); font-size:12.5px}
  pre{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:11px 13px; overflow-x:auto; white-space:pre-wrap; word-break:break-all; color:#c9d6e8}
  table{width:100%; border-collapse:collapse; font-size:13.5px}
  th{color:var(--muted); font-weight:600; text-align:start; padding:7px 10px; border-bottom:1px solid var(--line); font-size:12.5px}
  td{padding:8px 10px; border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent); vertical-align:top}
  tr:last-child td{border-bottom:none}
  tr.sel td{background:color-mix(in srgb,var(--blue) 10%,transparent)}
  tbody tr[data-sc]{cursor:pointer}
  .v-ok{color:var(--green); font-weight:700}
  .v-bad{color:var(--red); font-weight:700}
  .v-mid{color:var(--amber); font-weight:700}
  .btn{background:var(--panel2); border:1px solid var(--line); color:var(--ink); font:600 13px system-ui; padding:7px 16px; border-radius:8px; cursor:pointer}
  .btn:hover{border-color:var(--blue)}
  .btn:disabled{opacity:.45; cursor:default}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0}
  .note{color:var(--muted); font-size:12.5px; margin-top:8px}
  .banner{border:1px solid color-mix(in srgb,var(--violet) 45%,transparent); background:color-mix(in srgb,var(--violet) 8%,transparent); border-radius:10px; padding:10px 14px; font-size:13px; margin:14px 0}
  code{font-family:var(--mono); font-size:.92em; background:var(--panel2); padding:1px 6px; border-radius:6px}
  .codeblk{direction:ltr; text-align:left}
  #boot{color:var(--muted); font-size:12.5px; margin-top:10px}
  @media print{
    nav{display:none}
    body{background:#fff; color:#111; padding:0}
    .card,pre{border-color:#ccc; background:#fff}
    .sub,.d,.note,th,#boot{color:#444}
    a{color:#0645ad}
    section{padding:18px 0}
  }
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a href="#api">API</a>
    <a href="#arc">Gate arc</a>
    <a href="#playground">Live SDK</a>
    <a href="#boundary">Boundary</a>
    <button id="langBtn" data-i18n="langbtn"></button>
  </div>
  <div class="wrap" style="padding-top:0">
    <span id="boot" data-i18n="boot_checking"></span>
  </div>
</nav>
<header class="wrap">
  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="sub"></p>
  <p class="mono" style="margin-top:10px; color:var(--muted)" data-i18n="runline"></p>
</header>
<div class="wrap">

<section id="api">
  <h2 data-i18n="h_api"></h2>
  <div class="grid g3">
    <div class="card"><h3 class="ltr">verifyFixture(&#123;fixture&#125;)</h3><p class="d" data-i18n="api_verify"></p></div>
    <div class="card"><h3 class="ltr">verifyFixture(&#123;fixtureDir&#125;)</h3><p class="d" data-i18n="api_verifydir"></p></div>
    <div class="card"><h3 class="ltr">releaseWhen(report, predicate)</h3><p class="d" data-i18n="api_gate"></p></div>
  </div>
  <div class="banner" data-i18n="banner"></div>
</section>

<section id="arc">
  <h2 data-i18n="h_arc"></h2>
  <div class="grid g3">
    <div class="card"><h3 class="ltr" style="color:var(--amber)">HOLD</h3><p class="d" data-i18n="arc_hold"></p></div>
    <div class="card"><h3 class="ltr" style="color:var(--green)">RELEASE</h3><p class="d" data-i18n="arc_release"></p></div>
    <div class="card"><h3 class="ltr" style="color:var(--red)">REFUSED</h3><p class="d" data-i18n="arc_refused"></p></div>
  </div>
  <div class="note" data-i18n="arc_note"></div>
</section>

<section id="playground">
  <h2 data-i18n="h_live"></h2>
  <p class="d" style="color:var(--muted); margin-bottom:10px" data-i18n="live_hint"></p>
  <div class="card">
    <table>
      <thead><tr><th data-i18n="th_sc"></th><th data-i18n="th_verdict"></th><th data-i18n="th_gate"></th><th data-i18n="th_try"></th></tr></thead>
      <tbody id="scBody"></tbody>
    </table>
  </div>
  <div class="card" style="margin-top:14px" id="scDetail">
    <h3 data-i18n="detail_empty"></h3>
    <pre class="codeblk" id="scDetailPre" style="display:none"></pre>
    <div id="scDetailNote" class="note"></div>
  </div>
  <pre class="codeblk" id="out" style="margin-top:14px; min-height:120px; display:none"></pre>
</section>

<section id="boundary">
  <h2 data-i18n="h_boundary"></h2>
  <div class="banner" data-i18n="bnd_banner"></div>
  <div class="grid g3">
    <div class="card"><h3 data-i18n="bnd_never1_t"></h3><p class="d" data-i18n="bnd_never1_d"></p></div>
    <div class="card"><h3 data-i18n="bnd_never2_t"></h3><p class="d" data-i18n="bnd_never2_d"></p></div>
    <div class="card"><h3 data-i18n="bnd_never3_t"></h3><p class="d" data-i18n="bnd_never3_d"></p></div>
  </div>
  <div class="note" data-i18n="bnd_note"></div>
</section>

</div>

 Encoding\n *\n * Ensures identical logical data always produces identical bytes.\n */\n\nimport { createHash } from \"node:crypto\";\n\n/* uint.js re-export resolved by the injected inline bundle below */\n\nconst ENCODING_VERSION = \"CGEP/1\";\n\n/**\n * Canonicalize any value to deterministic string representation.\n * Rules:\n * - Integers → decimal strings\n * - Addresses → lowercase hex with 0x\n * - Bytes → lowercase hex with 0x\n * - Booleans → true/false\n * - Null → null\n * - Objects → keys sorted alphabetically\n * - Arrays → elements in order, no trailing commas\n *\n * P1 (integer safety): JS Numbers are only accepted when they are safe\n * integers (|n| <= 2^53-1). Anything larger is an ambiguity hazard and FAILS\n * CLOSED — big integers MUST arrive as canonical decimal strings (uint.js).\n */\nexport function canonicalize(obj) {\n  if (obj === null || obj === undefined) return \"null\";\n  if (typeof obj === \"boolean\") return obj ? \"true\" : \"false\";\n  if (typeof obj === \"number\") {\n    if (!Number.isInteger(obj)) throw new Error(\"Non-integer numbers not supported\");\n    if (!Number.isSafeInteger(obj)) {\n      throw new Error(\n        `Unsafe JS Number ${obj}: pass large integers as canonical decimal strings (CGEP/1 uint)`\n      );\n    }\n    return String(obj);\n  }\n  if (typeof obj === \"string\") {\n    if (obj.startsWith(\"0x\")) return JSON.stringify(obj.toLowerCase());\n    return JSON.stringify(obj);\n  }\n  if (Array.isArray(obj)) {\n    const elements = obj.map((e) => canonicalize(e));\n    return \"[\" + elements.join(\",\") + \"]\";\n  }\n  if (typeof obj === \"object\") {\n    const keys = Object.keys(obj).sort();\n    const pairs = keys.map((k) => JSON.stringify(k) + \":\" + canonicalize(obj[k]));\n    return \"{\" + pairs.join(\",\") + \"}\";\n  }\n  throw new Error(`Unsupported type: ${typeof obj}`);\n}\n\n/**\n * Hash with domain separation.\n * H(\"CGEP/1:INTENT\" || canonicalized)\n */\nexport async function domainHash(domain, data) {\n  const encoder = new TextEncoder();\n  const domainBytes = encoder.encode(domain);\n  const dataBytes = encoder.encode(canonicalize(data));\n\n  const combined = new Uint8Array(domainBytes.length + dataBytes.length);\n  combined.set(domainBytes);\n  combined.set(dataBytes, domainBytes.length);\n\n  const digest = createHash(\"sha256\").update(combined).digest(\"hex\");\n  return \"0x\" + digest;\n}\n\n/**\n * Compute intent hash\n */\nexport async function hashIntent(intent) {\n  return domainHash(\"CGEP/1:INTENT\", intent);\n}\n\n/**\n * Compute policy hash\n */\nexport async function hashPolicy(policy) {\n  return domainHash(\"CGEP/1:POLICY\", policy);\n}\n\n/**\n * Compute trace hash\n */\nexport async function hashTrace(trace) {\n  return domainHash(\"CGEP/1:TRACE\", trace);\n}\n\n/**\n * Compute evidence commitment\n */\nexport async function hashEvidence(evidence) {\n  return domainHash(\"CGEP/1:EVIDENCE\", evidence);\n}\n\n/**\n * Compute canonical state-delta commitment (P1)\n */\nexport async function hashStateDelta(stateDelta) {\n  return domainHash(\"CGEP/1:STATEDELTA\", stateDelta);\n}\n\n/**\n * Compute receipt ID\n */\nexport async function computeReceiptId(receipt) {\n  return domainHash(\"CGEP/1:RECEIPT\", receipt);\n}\n\n/* ---- merged from packages/canonical/uint.js (injected bundle) ---- */\n/**\n * CoreGuard Canonical Unsigned Integer (P1)\n *\n * CGEP/1 encodes every unsigned integer as a canonical DECIMAL string:\n *   - no leading zeros (except \"0\")\n *   - no sign, no exponent\n *   - bounded by uint256 (0 .. 2^256-1)\n *\n * Every representation is accepted on input (RPC-lowercase hex \"0x…\",\n * uppercase \"0X…\", decimal strings, safe integers, BigInt) and collapsed to\n * the ONE canonical decimal string. Hex that is NOT canonical (uppercase,\n * \"0x00ff\", \"0X\") is still accepted and normalized — because it can come from\n * an RPC. Any value that cannot represent an unsigned integer FAILS CLOSED\n * (throws): floats, negatives, malformed strings, \"0x\"-only, > uint256.\n *\n * JavaScript numbers are the primary hazard (2^53 precision wall) — code MUST\n * pass large integers as decimal strings, never as JS Number. canonicalize()\n * rejects unsafe JS Numbers so they can never leak into a commitment.\n */\n\nconst UINT256_MAX_BI = 0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffn;\nconst UINT64_MAX_BI = 0xffffffffffffffffn;\n\nconst UINT256_MAX = String(UINT256_MAX_BI);\nconst UINT64_MAX = String(UINT64_MAX_BI);\n\nconst HEX_UINT_RE = /^0[xX][0-9a-fA-F]+$/;\nconst DEC_UINT_RE = /^\\d+$/;\n\n/**\n * Collapse any supported representation of an unsigned integer to its\n * canonical CGEP/1 decimal string. Throws (fail-closed) on anything that is\n * not a uint256-compatible value.\n *\n *   canonicalUintString(\"0xde0b6b3a7640000\")   -> \"1000000000000000000\"\n *   canonicalUintString(\"1000000000000000000\") -> \"1000000000000000000\"\n *   canonicalUintString(42)                    -> \"42\"\n *   canonicalUintString(10 ** 18)              -> THROWS (unsafe JS Number)\n *   canonicalUintString(-1)                    -> THROWS\n *   canonicalUintString(\"0x\")                  -> THROWS\n *   canonicalUintString(0xFFFF...FFFF)         -> THROWS (exceeds uint256)\n */\nfunction canonicalUintString(value) {\n  let big;\n  if (typeof value === \"bigint\") {\n    big = value;\n  } else if (typeof value === \"number\") {\n    if (!Number.isFinite(value)) throw new TypeError(\"uint: non-finite number\");\n    if (!Number.isInteger(value)) throw new TypeError(\"uint: non-integer number\");\n    if (value < 0) throw new TypeError(\"uint: negative number\");\n    if (!Number.isSafeInteger(value)) {\n      throw new TypeError(\n        \"uint: unsafe JS Number (>2^53). Pass large integers as decimal strings.\"\n      );\n    }\n    big = BigInt(value);\n  } else if (typeof value === \"string\") {\n    const s = value.trim();\n    if (s === \"\") throw new TypeError(`uint: empty string`);\n    if (HEX_UINT_RE.test(s)) {\n      big = BigInt(s);\n    } else if (DEC_UINT_RE.test(s)) {\n      big = BigInt(s);\n    } else {\n      throw new TypeError(`uint: unsupported integer string \"${s}\"`);\n    }\n  } else {\n    throw new TypeError(`uint: unsupported type ${typeof value}`);\n  }\n\n  if (big < 0n) throw new TypeError(\"uint: negative value\");\n  if (big > UINT256_MAX_BI) throw new TypeError(\"uint: exceeds uint256 range\");\n  return big.toString();\n}\n\n/**\n * True when the string is a well-formed canonical uint (decimal, no leading\n * zeros, within uint256). Adversarial check: canonical forms must be unique.\n */\nfunction isCanonicalUintString(value) {\n  if (typeof value !== \"string\") return false;\n  if (!DEC_UINT_RE.test(value)) return false;\n  if (value.length > 1 && value.startsWith(\"0\")) return false;\n  try {\n    return BigInt(value) <= UINT256_MAX_BI;\n  } catch {\n    return false;\n  }\n}\n\n/**\n * Security-critical integer guard (canonicalization audit, P0.2).\n *\n * Public builder APIs for amount / gas / timestamp / block / nonce / chainId\n * MUST receive a canonical decimal string or bigint. JS Numbers are rejected\n * OUTRIGHT — a Number literal like `9007199254740993` has already been\n * silently rounded by the runtime (2^53 wall) before any function sees it, so\n * accepting any Number type makes silent precision loss possible.\n *\n * Valid string spellings (decimal, or RPC hex like \"0x100\") are VALIDATED —\n * including the uint256 range — and returned UNCHANGED: the declaration layer\n * binds exact spelling, so hex and its decimal twin are distinct records\n * (see test/firewall/attack-lab/a14-numerics.test.js). Non-canonical decimal\n * spellings (\"007\"), floats, exponent forms and malformed strings fail closed.\n * bigints are collapsed to their canonical decimal form.\n */\nfunction securityUint(name, value) {\n  if (typeof value === \"number\") {\n    throw new TypeError(\n      `securityUint(\"${name}\"): JS Number is forbidden for security-critical ` +\n        \"integers; pass a canonical decimal string or bigint\"\n    );\n  }\n  if (typeof value === \"string\") {\n    const s = value;\n    if (s === \"\") throw new TypeError(`uint: empty string`);\n    if (HEX_UINT_RE.test(s)) {\n      if (BigInt(s) > UINT256_MAX_BI) {\n        throw new TypeError(\"uint: exceeds uint256 range\");\n      }\n      return s;\n    }\n    if (DEC_UINT_RE.test(s)) {\n      if (s.length > 1 && s.startsWith(\"0\")) {\n        throw new TypeError(`uint: non-canonical decimal spelling \"${s}\"`);\n      }\n      if (BigInt(s) > UINT256_MAX_BI) {\n        throw new TypeError(\"uint: exceeds uint256 range\");\n      }\n      return s;\n    }\n    throw new TypeError(`uint: unsupported integer string \"${s}\"`);\n  }\n  if (typeof value === \"bigint\") {\n    if (value < 0n) throw new TypeError(\"uint: negative value\");\n    if (value > UINT256_MAX_BI) throw new TypeError(\"uint: exceeds uint256 range\");\n    return value.toString();\n  }\n  throw new TypeError(`uint: unsupported type ${typeof value}`);\n}\n\n/**\n * Decode to BigInt (throws on malformed / out-of-range).\n */\nfunction uintToBigInt(value) {\n  return BigInt(canonicalUintString(value));\n}","packages/delivery/index.js":"/**\n * CoreGuard Delivery & Dispute Evidence (DDE/1) — the execution/acceptance\n * boundary, enforced.\n *\n * The one rule this package exists to enforce (binding on every caller):\n *\n *   EXECUTION VERIFICATION NEVER DECIDES DELIVERY CONFORMITY.\n *   payment_settled=true NEVER implies delivery_accepted=true.\n *\n * CoreGuard's provenance layer proves WHO authorized WHAT, and that it RAN.\n * Those facts are necessary inputs to any dispute — and categorically\n * insufficient to decide whether the delivered work satisfied the deal.\n * This module carries the delivery-side evidence model: agreement, acceptance\n * criteria, delivery, acceptance/rejection, dispute positions, consent,\n * retention — and a fail-closed verifier that refuses to let the two\n * questions bleed into each other.\n *\n * Verdict vocabulary (fail-closed, no implicit conversions):\n *   PASS     the condition genuinely held, with evidence\n *   FAIL     a violation was caught by a closed check\n *   NOT_RUN  the check was not evaluable (never fabricated)\n *\n * Layer separation (provenance domain vs DDE domain):\n *   authLayer       — who authorized, with which signature (provenance)\n *   execLayer       — on-chain execution facts (provenance)\n *   deliveryLayer   — what was delivered (DDE)\n *   acceptanceLayer — human judgment over conformity (never derived)\n *\n * People's Court / Epistemic Labs mapping is a pure projection: evidence\n * classification only — no custody transfer, no judgment, no merit finding.\n *\n * Zero dependencies. Cryptographic replay is injected (the same optional\n * adapter pattern as provenance); without it, signature checks report\n * NOT_RUN — never a fabricated result.\n */\n\nimport { domainHash } from \"@coreguard/canonical\";\n\nexport const DDE_VERSION = \"DDE/1\";\n\n/** Canonical domain tags for DDE record hashing (mirrors CGEP/1 style). */\nexport const DDE_DOMAIN = Object.freeze({\n  AGREEMENT: \"DDE/1:AGREEMENT\",\n  CRITERIA: \"DDE/1:ACCEPTANCE-CRITERIA\",\n  DELIVERY: \"DDE/1:DELIVERY\",\n  ACCEPTANCE: \"DDE/1:ACCEPTANCE-RECORD\",\n  DISPUTE: \"DDE/1:DISPUTE-RECORD\",\n});\n\n/** Record lifecycle — explicit, monotonic, never inferred from other records. */\nexport const FIXTURE_STATES = Object.freeze([\n  \"DRAFT\",\n  \"DELIVERY_SUBMITTED\",\n  \"ACCEPTANCE_RECORDED\",\n  \"DISPUTE_OPEN\",\n  \"RECORD_CLOSED\",\n]);\n\n/** Agreement lifecycle vocabulary. */\nexport const AGREEMENT_STATES = Object.freeze([\n  \"OFFERED\",\n  \"ACCEPTED\",\n  \"ACTIVE\",\n  \"PERFORMED\",\n  \"DISPUTED\",\n  \"CANCELLED\",\n  \"PHASE1_COMPLETED\",\n]);\n\n/** Closed remedy vocabulary — no free-form remedies, no engine judgment. */\nexport const REMEDIES = Object.freeze([\n  \"NONE\",\n  \"REWORK\",\n  \"PARTIAL_REFUND\",\n  \"FULL_REFUND\",\n  \"CREDIT\",\n]);\n\n/** Evidence classes for the People's Court projection (closed list). */\nexport const PC_EVIDENCE_KINDS = Object.freeze([\n  \"AGREEMENT\",\n  \"ACCEPTANCE_CRITERIA\",\n  \"AUTHORIZATION\",\n  \"EXECUTION\",\n  \"DELIVERY\",\n  \"ACCEPTANCE_RECORD\",\n  \"DISPUTE_RECORD\",\n  \"CONSENT\",\n  \"RETENTION\",\n]);\n\n/** The engine's boundary banner — every report carries it; quoting DDE output\n *  without this sentence misrepresents the engine's reach. */\nexport const BOUNDARY_BANNER = Object.freeze({\n  code: \"DDE-BOUNDARY\",\n  statement:\n    \"Execution verification does not decide delivery conformity. \" +\n    \"Acceptance or rejection of the delivered work is a separate determination \" +\n    \"recorded by the parties, not derived from on-chain facts.\",\n});\n\n/** ---------------------------------------------------------------- hashes */\n\nexport async function agreementDigest(rec) {\n  return domainHash(DDE_DOMAIN.AGREEMENT, rec);\n}\n\nexport async function criteriaDigest(rec) {\n  return domainHash(DDE_DOMAIN.CRITERIA, rec);\n}\n\nexport async function deliveryDigest(rec) {\n  return domainHash(DDE_DOMAIN.DELIVERY, rec);\n}\n\nexport async function acceptanceDigest(rec) {\n  return domainHash(DDE_DOMAIN.ACCEPTANCE, rec);\n}\n\nexport async function disputeDigest(rec) {\n  return domainHash(DDE_DOMAIN.DISPUTE, rec);\n}\n\n/**\n * Deterministic SHA-256 over exact utf-8 bytes of an artifact's content.\n * Centralized so the generator and every re-checker hash identically —\n * the single definition of \"the bytes of this artifact\".\n */\nexport async function artifactSha256(content) {\n  const { createHash } = await import(\"node:crypto\");\n  return (\n    \"0x\" +\n    createHash(\"sha256\").update(Buffer.from(String(content), \"utf8\")).digest(\"hex\")\n  );\n}\n\n/** ------------------------------------------------------- F1 — separation */\n\nconst F1_FORBIDDEN_GROUNDS = Object.freeze([\n  \"payment settled\",\n  \"payment_settled\",\n  \"txstatus=1\",\n  \"receipt proves\",\n  \"on-chain success proves\",\n]);\n\n/**\n * F1 — EXECUTION/ACCEPTANCE SEPARATION (fail-closed).\n *\n * An acceptance/rejection record is honest only if it stands on its own:\n * signed by a party, citing the criteria it applies. The classic dishonest\n * shapes this check kills:\n *   - acceptance grounds quoting execution facts (\"payment settled\", …)\n *   - an explicit inference marker (derivedFrom: \"execution\")\n *   - an acceptance verdict with no criteriaRef\n *\n * @returns {{ result: \"PASS\"|\"FAIL\", reasons: string[] }}\n */\nexport function checkExecutionAcceptanceSeparation(fixture) {\n  const reasons = [];\n  const acc = fixture && fixture.acceptanceRecord;\n  if (!acc || typeof acc !== \"object\") {\n    reasons.push(\"acceptanceRecord missing\");\n    return { result: \"FAIL\", reasons };\n  }\n  if (!acc.criteriaRef) {\n    reasons.push(\"acceptanceRecord.criteriaRef missing — acceptance must cite the criteria it applies\");\n  }\n  const signers = Array.isArray(acc.signedBy) ? acc.signedBy : [];\n  if (signers.length === 0) {\n    reasons.push(\"acceptanceRecord.signedBy missing — acceptance must be a party act, not a system inference\");\n  }\n  const text = JSON.stringify(acc).toLowerCase();\n  for (const g of F1_FORBIDDEN_GROUNDS) {\n    if (text.includes(g)) {\n      reasons.push(`acceptance grounds quote execution facts (\"${g}\") — F1 violation`);\n    }\n  }\n  if (acc.derivedFrom === \"execution\" || acc.derivedFrom === \"EXECUTION\") {\n    reasons.push('acceptanceRecord.derivedFrom = \"execution\" — acceptance may not be derived from execution facts');\n  }\n  return { result: reasons.length === 0 ? \"PASS\" : \"FAIL\", reasons };\n}\n\n/** -------------------------------------------------- F2 — criteria closure */\n\n/**\n * F2 — CRITERIA CLOSURE: every criterion in acceptance-criteria is evaluated\n * by the acceptance record (no silent skips) and every evaluation cites a\n * criterion that exists (no invented passes).\n */\nexport function checkCriteriaClosure(fixture) {\n  const criteria = (fixture && fixture.acceptanceCriteria && fixture.acceptanceCriteria.criteria) || [];\n  const evals = (fixture && fixture.acceptanceRecord && fixture.acceptanceRecord.evaluations) || [];\n  const critIds = new Set(criteria.map((c) => c.id).filter(Boolean));\n  const evalIds = new Set(evals.map((e) => e.criterionId).filter(Boolean));\n\n  const unevaluated = [...critIds].filter((id) => !evalIds.has(id));\n  const uncited = [...evalIds].filter((id) => !critIds.has(id));\n  const ok = unevaluated.length === 0 && uncited.length === 0;\n  return { result: ok ? \"PASS\" : \"FAIL\", unevaluated, uncited };\n}\n\n/** ------------------------------------------------------------ E3 — replay */\n\n/**\n * E3 — DELIVERY INTEGRITY REPLAY: every artifact in the delivery manifest\n * re-hashes (SHA-256 over exact utf-8 bytes of `content`) and must match its\n * recorded sha256. Fail-closed on any mismatch or missing field.\n *\n * @returns {Promise<{result:\"PASS\"|\"FAIL\", checked:number, mismatches:string[]}>}\n */\nexport async function replayDeliveryIntegrity(delivery) {\n  const artifacts = (delivery && delivery.artifacts) || [];\n  const mismatches = [];\n  let checked = 0;\n  for (const a of artifacts) {\n    if (!a || typeof a !== \"object\") { mismatches.push(\"(malformed artifact)\"); continue; }\n    if (!a.id) { mismatches.push(\"(artifact without id)\"); continue; }\n    if (typeof a.content !== \"string\") { mismatches.push(`${a.id}: content missing`); continue; }\n    if (!a.sha256 || !/^0x[0-9a-f]{64}$/.test(a.sha256)) { mismatches.push(`${a.id}: sha256 malformed`); continue; }\n    const actual = await artifactSha256(a.content);\n    checked += 1;\n    if (actual !== a.sha256) {\n      mismatches.push(`${a.id}: recorded ${a.sha256.slice(0, 10)}… != actual ${actual.slice(0, 10)}…`);\n    }\n  }\n  const ok = checked > 0 && mismatches.length === 0;\n  return { result: ok ? \"PASS\" : \"FAIL\", checked, mismatches };\n}\n\n/** ------------------------------------------------- E4 — authorization chain */\n\nconst ADDRESS_RE = /^0x[0-9a-fA-F]{40}$/;\n\n/**\n * E4 — AUTHORIZATION BINDING: the delivery must descend from the agreement,\n * execution, and declared intent the parties actually signed. Fail-closed\n * when any reference is broken or the authorizing agent is not the\n * agreement's client-side agent.\n */\nexport function checkAuthorizationBinding(fixture) {\n  const reasons = [];\n  const a = fixture && fixture.agreement;\n  const d = fixture && fixture.delivery;\n  const x = fixture && fixture.execution;\n  const z = fixture && fixture.authorization;\n  if (!a || !d || !x || !z) {\n    return { result: \"FAIL\", reasons: [\"fixture missing agreement/delivery/execution/authorization\"] };\n  }\n  if (d.agreementRef !== a.agreementId) {\n    reasons.push(`delivery.agreementRef (${d.agreementRef}) != agreement.agreementId (${a.agreementId})`);\n  }\n  if (d.executionRef !== x.executionId) {\n    reasons.push(`delivery.executionRef (${d.executionRef}) != execution.executionId (${x.executionId})`);\n  }\n  if (z.subject && a.client && a.client.agentAddress &&\n      String(z.subject).toLowerCase() !== String(a.client.agentAddress).toLowerCase()) {\n    reasons.push(\"authorization.subject != agreement.client.agentAddress\");\n  }\n  if (!z.intentHash || !/^0x[0-9a-f]{64}$/.test(z.intentHash)) {\n    reasons.push(\"authorization.intentHash missing or malformed\");\n  }\n  if (z.intent && z.intent.intentHash && z.intent.intentHash !== z.intentHash) {\n    reasons.push(\"authorization.intent.intentHash != authorization.intentHash (self-consistency)\");\n  }\n  return { result: reasons.length === 0 ? \"PASS\" : \"FAIL\", reasons };\n}\n\n/** ----------------------------------------------- B1–B3 — boundary guards */\n\n/**\n * B1 — PAYMENT INFERENCE FORBIDDEN: payment completion can never be the\n * acceptance basis. Structural: `basis = [\"PAYMENT_SETTLED\"]` alone fails;\n * an ACCEPTED verdict without a CRITERIA_EVALUATION basis fails.\n */\nexport function checkB1PaymentInferenceForbidden(fixture) {\n  const reasons = [];\n  const acc = fixture && fixture.acceptanceRecord;\n  if (acc && Array.isArray(acc.basis)) {\n    const nonPayment = acc.basis.filter((b) => b !== \"PAYMENT_SETTLED\");\n    if (acc.basis.includes(\"PAYMENT_SETTLED\") && nonPayment.length === 0) {\n      reasons.push(\"acceptanceRecord.basis = [PAYMENT_SETTLED] only — payment cannot be the acceptance basis\");\n    }\n  }\n  if (acc && acc.verdict === \"ACCEPTED\" && Array.isArray(acc.basis) &&\n      !acc.basis.includes(\"CRITERIA_EVALUATION\")) {\n    reasons.push(\"ACCEPTED verdict without CRITERIA_EVALUATION basis\");\n  }\n  return { result: reasons.length === 0 ? \"PASS\" : \"FAIL\", reasons };\n}\n\n/**\n * B2 — EXECUTION DOES NOT DECIDE CONFORMITY: an ACCEPTED or REJECTED verdict\n * must rest on criterion evaluations. Zero evaluations under either verdict\n * means conformity was decided by something other than the criteria — FAIL.\n * (The engine structurally reads nothing from `execution` for conformity;\n * this check makes the corresponding fixture-level abuse detectable.)\n */\nexport function checkB2ExecutionDoesNotDecideConformity(fixture) {\n  const reasons = [];\n  const acc = fixture && fixture.acceptanceRecord;\n  if (acc && (acc.verdict === \"ACCEPTED\" || acc.verdict === \"REJECTED\")) {\n    const n = Array.isArray(acc.evaluations) ? acc.evaluations.length : 0;\n    if (n === 0) {\n      reasons.push(`${acc.verdict} with zero criterion evaluations — conformity decided by something other than criteria`);\n    }\n  }\n  return { result: reasons.length === 0 ? \"PASS\" : \"FAIL\", reasons };\n}\n\n/**\n * B3 — NO ENGINE ADJUDICATION: the dispute record must carry BOTH parties'\n * positions with an explicit requestedRemedy each (closed vocabulary), and\n * the engine never names a winner.\n */\nexport function checkB3NoEngineAdjudication(fixture) {\n  const reasons = [];\n  const d = fixture && fixture.disputeRecord;\n  if (!d || typeof d !== \"object\") return { result: \"FAIL\", reasons: [\"disputeRecord missing\"] };\n  for (const side of [\"partyA\", \"partyB\"]) {\n    const p = d[side];\n    if (!p || typeof p !== \"object\") { reasons.push(`disputeRecord.${side} missing`); continue; }\n    if (!p.position) reasons.push(`disputeRecord.${side}.position missing`);\n    if (!p.requestedRemedy) reasons.push(`disputeRecord.${side}.requestedRemedy missing`);\n    else if (!REMEDIES.includes(p.requestedRemedy)) {\n      reasons.push(`disputeRecord.${side}.requestedRemedy \"${p.requestedRemedy}\" outside closed remedy vocabulary`);\n    }\n  }\n  return { result: reasons.length === 0 ? \"PASS\" : \"FAIL\", reasons };\n}\n\n/** ------------------------------------------------- E5 — consent binding */\n\nconst GRANT_TYPES = Object.freeze({\n  RedactionGrant: [\n    { name: \"grantor\", type: \"address\" },\n    { name: \"fixtureRef\", type: \"bytes32\" },\n    { name: \"scope\", type: \"string\" },\n  ],\n});\n\n/** EIP-712 digest for one redaction grant. Exported for generator parity. */\nexport function redactionGrantDigest(grant, evm, chainId = \"1116\") {\n  return evm.typedDataDigestWithDomain(\n    \"RedactionGrant\",\n    GRANT_TYPES,\n    { grantor: grant.grantor, fixtureRef: grant.fixtureRef, scope: grant.scope },\n    {\n      name: \"CoreGuard DDE Redaction Grant\",\n      version: \"1\",\n      chainId: BigInt(chainId),\n    },\n  );\n}\n\n/**\n * E5 — CONSENT BINDING: both parties' redaction-grant signatures replay to\n * their declared grantor. With no EVM adapter the check reports NOT_RUN —\n * never a fabricated cryptographic result.\n *\n * @returns {Promise<{result:\"PASS\"|\"FAIL\"|\"NOT_RUN\", reasons?:string[], note?:string}>}\n */\nexport async function checkConsentBinding(fixture, evm = undefined) {\n  const consent = fixture && fixture.consentAndDisclosure;\n  if (!evm) {\n    return {\n      result: \"NOT_RUN\",\n      note: \"EVM adapter not provided — consent signature replay NOT evaluated (never fabricated)\",\n    };\n  }\n  const reasons = [];\n  const grants = (consent && consent.redactionGrants) || [];\n  if (!Array.isArray(grants) || grants.length < 2) {\n    return { result: \"FAIL\", reasons: [\"redactionGrants must carry both parties' grants\"] };\n  }\n  for (const g of grants) {\n    if (!g.grantor || !g.fixtureRef || !g.scope || !g.signature) {\n      reasons.push(`grant for ${g.grantor || \"?\"} missing grantor/fixtureRef/scope/signature`);\n      continue;\n    }\n    try {\n      const digest = redactionGrantDigest(g, evm, (consent && consent.chainId) || \"1116\");\n      const recovered = evm.recoverSignerAddress(digest, g.signature);\n      if (String(recovered).toLowerCase() !== String(g.grantor).toLowerCase()) {\n        reasons.push(`consent signature recovered ${recovered} != grantor ${g.grantor}`);\n      }\n    } catch (e) {\n      reasons.push(`consent replay error: ${e.message}`);\n    }\n  }\n  return { result: reasons.length === 0 ? \"PASS\" : \"FAIL\", reasons };\n}\n\n/** ------------------------------------------------- F3 — lifecycle truth */\n\n/**\n * F3 — LIFECYCLE CONSISTENCY: the declared fixture state must match what its\n * records actually establish. Records establish a state; the declared state\n * is checked against them — never inferred silently in the other direction.\n * A closed dispute record (closedAtUtc set) establishes RECORD_CLOSED; closure\n * of the record is NOT adjudication — B3 still names no winner.\n * The closure chain is ORDERED and fail-closed: a closed stamp must be a\n * parseable UTC timestamp that FOLLOWS the record's opening (openedAtUtc)\n * and does not exceed the record's own closure deadline (recordClosesAtUtc).\n * Closure outside that window — or declared without a stamp — is a forged\n * record regardless of what the fixture declares.\n */\nexport function checkLifecycleConsistency(fixture) {\n  const declared = fixture && fixture.lifecycleState;\n  const d = fixture && fixture.disputeRecord;\n  // Ordered closure-chain validation (independent of the declared state).\n  const parseUtc = (v) => (typeof v === \"string\" && Number.isFinite(Date.parse(v)) ? Date.parse(v) : null);\n  if (d && d.closedAtUtc) {\n    const closedMs = parseUtc(d.closedAtUtc);\n    const openedMs = d.openedAtUtc != null ? parseUtc(d.openedAtUtc) : null;\n    const deadlineMs = d.recordClosesAtUtc != null ? parseUtc(d.recordClosesAtUtc) : null;\n    const reasons = [];\n    if (closedMs === null) reasons.push(\"disputeRecord.closedAtUtc is not a parseable UTC timestamp\");\n    if (openedMs === null) reasons.push(\"closure requires disputeRecord.openedAtUtc (closure cannot precede its opening)\");\n    else if (closedMs !== null && closedMs < openedMs) {\n      reasons.push(\"closure precedes its own opening (closedAtUtc < openedAtUtc)\");\n    }\n    if (deadlineMs !== null && closedMs !== null && closedMs > deadlineMs) {\n      reasons.push(\"closure exceeds the record's own closure deadline (closedAtUtc > recordClosesAtUtc)\");\n    }\n    if (reasons.length) {\n      return { result: \"FAIL\", declared: declared ?? null, expected: reasons.join(\"; \") };\n    }\n  }\n  const expected =\n    d && d.closedAtUtc ? \"RECORD_CLOSED\"\n    : d && d.openedAtUtc ? \"DISPUTE_OPEN\"\n    : fixture && fixture.acceptanceRecord && fixture.acceptanceRecord.verdict ? \"ACCEPTANCE_RECORDED\"\n    : fixture && fixture.delivery && fixture.delivery.submittedAtUtc ? \"DELIVERY_SUBMITTED\"\n    : \"DRAFT\";\n  return {\n    result: declared === expected ? \"PASS\" : \"FAIL\",\n    declared: declared ?? null,\n    expected,\n  };\n}\n\n/** ------------------------------------------------------ full fixture gate */\n\n/**\n * Run the whole fail-closed gate over a loaded fixture object.\n *\n * Shape: { origin?, lifecycleState?, agreement, acceptanceCriteria, parties,\n *          authorization, execution, delivery, acceptanceRecord,\n *          disputeRecord, consentAndDisclosure, retentionPolicy }\n *\n * @param {object} fixture\n * @param {object} [evm] optional EVM adapter (consent signature replay);\n *                       absent → E5 NOT_RUN\n * @returns {Promise<object>} full report: status, decision, boundary, checks, summary\n */\nexport async function verifyDeliveryFixture(fixture, evm = undefined) {\n  const checks = [];\n  const add = (id, name, result, extra = {}) => checks.push({ id, name, result, ...extra });\n\n  // F0 — required records present\n  const required = [\n    \"agreement\", \"acceptanceCriteria\", \"parties\", \"authorization\",\n    \"execution\", \"delivery\", \"acceptanceRecord\", \"disputeRecord\",\n    \"consentAndDisclosure\", \"retentionPolicy\",\n  ];\n  const missing = required.filter((k) => !fixture || !fixture[k]);\n  add(\"F0\", \"REQUIRED_RECORDS\", missing.length === 0 ? \"PASS\" : \"FAIL\",\n    missing.length ? { missing } : {});\n\n  // F1 — execution/acceptance separation\n  const f1 = checkExecutionAcceptanceSeparation(fixture);\n  add(\"F1\", \"EXECUTION_ACCEPTANCE_SEPARATION\", f1.result, { reasons: f1.reasons });\n\n  // F2 — criteria closure\n  const f2 = checkCriteriaClosure(fixture);\n  add(\"F2\", \"CRITERIA_CLOSURE\", f2.result,\n    { unevaluated: f2.unevaluated, uncited: f2.uncited });\n\n  // E3 — delivery integrity replay\n  const e3 = await replayDeliveryIntegrity(fixture && fixture.delivery);\n  add(\"E3\", \"DELIVERY_INTEGRITY_REPLAY\", e3.result,\n    { checked: e3.checked, mismatches: e3.mismatches });\n\n  // E4 — authorization binding\n  const e4 = checkAuthorizationBinding(fixture);\n  add(\"E4\", \"AUTHORIZATION_BINDING\", e4.result, { reasons: e4.reasons });\n\n  // B1–B3 — boundary guards\n  const b1 = checkB1PaymentInferenceForbidden(fixture);\n  add(\"B1\", \"PAYMENT_INFERENCE_FORBIDDEN\", b1.result, { reasons: b1.reasons });\n  const b2 = checkB2ExecutionDoesNotDecideConformity(fixture);\n  add(\"B2\", \"EXECUTION_DOES_NOT_DECIDE_CONFORMITY\", b2.result, { reasons: b2.reasons });\n  const b3 = checkB3NoEngineAdjudication(fixture);\n  add(\"B3\", \"NO_ENGINE_ADJUDICATION\", b3.result, { reasons: b3.reasons });\n\n  // E5 — consent binding (signature replay when the adapter is available)\n  const e5 = await checkConsentBinding(fixture, evm);\n  add(\"E5\", \"CONSENT_BINDING\", e5.result,\n    e5.result === \"NOT_RUN\" ? { note: e5.note } : { reasons: e5.reasons || [] });\n\n  // F3 — lifecycle consistency\n  const f3 = checkLifecycleConsistency(fixture);\n  add(\"F3\", \"LIFECYCLE_CONSISTENCY\", f3.result,\n    { declared: f3.declared, expected: f3.expected });\n\n  const failed = checks.filter((c) => c.result === \"FAIL\");\n  const status = failed.length === 0 ? \"VERIFIED\" : \"REJECTED\";\n\n  return {\n    engine: \"coreguard-dde\",\n    ddeVersion: DDE_VERSION,\n    fixtureOrigin: (fixture && fixture.origin) || \"UNDECLARED\",\n    status,\n    decision: failed.length === 0\n      ? \"EXECUTION_EVIDENCE_ADMISSIBLE — CONFORMITY_UNDECIDED_BY_ENGINE\"\n      : \"FIXTURE_REJECTED\",\n    boundary: BOUNDARY_BANNER.statement,\n    checks,\n    summary: {\n      total: checks.length,\n      pass: checks.filter((c) => c.result === \"PASS\").length,\n      fail: failed.length,\n      notRun: checks.filter((c) => c.result === \"NOT_RUN\").length,\n    },\n  };\n}\n\n/** ------------------------------------- People's Court projection (C1–C6) */\n\n/**\n * Project a fixture into People's Court's neutral intake model.\n * PURE mapping — classification of evidence classes only. It performs no\n * custody transfer, no judgment, no merit assessment; `readiness` is a\n * documentation-completeness signal, not a legal conclusion.\n *\n * @returns {{ mappable:boolean, items:Array, gaps:string[], readiness:string }}\n */\nexport function mapToPeoplesCourt(fixture) {\n  const items = [];\n  const gaps = [];\n  const push = (kind, ref, note) => items.push({ kind, ref, note: note ?? null });\n\n  const a = fixture && fixture.agreement;\n  if (a && a.agreementId) push(\"AGREEMENT\", a.agreementId, `version ${a.version ?? \"?\"}`);\n  else gaps.push(\"AGREEMENT record missing or unidentified\");\n\n  const c = fixture && fixture.acceptanceCriteria;\n  if (c && Array.isArray(c.criteria) && c.criteria.length) {\n    push(\"ACCEPTANCE_CRITERIA\", `${c.criteria.length} criteria`, c.criteriaRef ?? null);\n  } else gaps.push(\"ACCEPTANCE_CRITERIA empty\");\n\n  const z = fixture && fixture.authorization;\n  if (z && z.intentHash) push(\"AUTHORIZATION\", z.intentHash, z.scheme ?? null);\n  else gaps.push(\"AUTHORIZATION intent hash missing\");\n\n  const x = fixture && fixture.execution;\n  if (x && x.txHash) push(\"EXECUTION\", x.txHash, `chainId ${x.chainId ?? \"?\"}`);\n  else gaps.push(\"EXECUTION tx hash missing\");\n\n  const d = fixture && fixture.delivery;\n  if (d && Array.isArray(d.artifacts) && d.artifacts.length) {\n    push(\"DELIVERY\", `${d.artifacts.length} artifacts`, \"sha256-pinned\");\n  } else gaps.push(\"DELIVERY artifacts missing\");\n\n  const acc = fixture && fixture.acceptanceRecord;\n  if (acc && acc.verdict) push(\"ACCEPTANCE_RECORD\", acc.verdict, acc.criteriaRef ?? null);\n  else gaps.push(\"ACCEPTANCE_RECORD verdict missing\");\n\n  const disp = fixture && fixture.disputeRecord;\n  if (disp && disp.disputeId) {\n    const pa = disp.partyA && disp.partyA.requestedRemedy;\n    const pb = disp.partyB && disp.partyB.requestedRemedy;\n    push(\"DISPUTE_RECORD\", disp.disputeId, `remedies: A=${pa ?? \"?\"} / B=${pb ?? \"?\"}`);\n  } else gaps.push(\"DISPUTE_RECORD missing\");\n\n  const con = fixture && fixture.consentAndDisclosure;\n  if (con && Array.isArray(con.redactionGrants) && con.redactionGrants.length >= 2) {\n    push(\"CONSENT\", `${con.redactionGrants.length} grants`, \"both parties\");\n  } else gaps.push(\"CONSENT grants incomplete\");\n\n  const ret = fixture && fixture.retentionPolicy;\n  if (ret && ret.retentionUtcUntil) push(\"RETENTION\", ret.retentionUtcUntil, null);\n  else gaps.push(\"RETENTION policy missing\");\n\n  const mappable = gaps.length === 0;\n  return {\n    mappable,\n    items,\n    gaps,\n    readiness: mappable\n      ? \"READY_FOR_CLAIM_MAPPING — evidence classes complete; conformity question framed, not decided\"\n      : \"INCOMPLETE — see gaps\",\n  };\n}\n","packages/delivery/sdk.js":"/**\n * CoreGuard Delivery & Dispute Evidence (DDE/1) — integration SDK surface.\n *\n * The minimal programmatic surface an external platform (agent platform,\n * escrow provider, People's Court intake tooling) embeds to hold payment\n * hostage to evidence: verify a bilateral delivery fixture, get a JSON\n * report stamped with the binding boundary, and gate release on it.\n *\n *   import { verifyFixture, releaseWhen } from \"@coreguard/delivery/sdk\";\n *\n *   const report = await verifyFixture({ fixtureDir: \"./fixtures/case-17\" });\n *   const gate = releaseWhen(report, (r) => r.status === \"VERIFIED\" &&\n *                                         r.acceptance?.verdict === \"ACCEPTED\");\n *   if (!gate.release) holdPayment(gate.reasons);\n *\n * Semantics are the engine's, unchanged: this surface adds zero checks and\n * strips zero checks. Every report carries DDE-BOUNDARY. The SDK never\n * signs, never broadcasts, never judges conformity.\n *\n * Zero dependencies. Node >= 18.\n */\n\nimport { readFileSync, existsSync } from \"node:fs\";\nimport { dirname, join } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport {\n  verifyDeliveryFixture,\n  mapToPeoplesCourt,\n  DDE_VERSION,\n  BOUNDARY_BANNER,\n} from \"./index.js\";\n\nconst HERE = dirname(fileURLToPath(import.meta.url));\n\n/** File name → engine key for on-disk fixtures (verify-fixture.mjs parity). */\nconst FILE_TO_KEY = {\n  \"agreement.json\": \"agreement\",\n  \"acceptance-criteria.json\": \"acceptanceCriteria\",\n  \"parties.json\": \"parties\",\n  \"authorization.json\": \"authorization\",\n  \"execution-attestation.json\": \"execution\",\n  \"delivery-manifest.json\": \"delivery\",\n  \"acceptance-record.json\": \"acceptanceRecord\",\n  \"dispute-record.json\": \"disputeRecord\",\n  \"consent-and-disclosure.json\": \"consentAndDisclosure\",\n  \"retention-policy.json\": \"retentionPolicy\",\n};\n\n/**\n * Load a fixture from a directory of record JSON files.\n * Record pins are NOT re-hashed here (the SDK may receive fixtures without\n * their manifest); pass the directory containing `hashes.json` to\n * `verifyFixture` to get the pin verdict in the envelope.\n *\n * @param {string} dir directory containing the ten record files\n * @returns {{ fixture: object, hashesManifest: \"PRESENT\"|\"ABSENT\" }} loader result\n */\nexport function loadFixtureFromDir(dir) {\n  if (!dir || !existsSync(dir)) {\n    throw new Error(`fixture directory not found: ${dir}`);\n  }\n  const fixture = {};\n  for (const [name, key] of Object.entries(FILE_TO_KEY)) {\n    const path = join(dir, name);\n    if (!existsSync(path)) {\n      throw new Error(`${name} missing in ${dir} — mandatory record absent (fail-closed)`);\n    }\n    fixture[key] = JSON.parse(readFileSync(path, \"utf8\"));\n  }\n  const manifestPath = join(dir, \"hashes.json\");\n  if (existsSync(manifestPath)) {\n    const manifest = JSON.parse(readFileSync(manifestPath, \"utf8\"));\n    if (manifest.fixture) {\n      if (manifest.fixture.origin) fixture.origin = manifest.fixture.origin;\n      if (manifest.fixture.lifecycleState) fixture.lifecycleState = manifest.fixture.lifecycleState;\n    }\n    return { fixture, hashesManifest: \"PRESENT\" };\n  }\n  return { fixture, hashesManifest: \"ABSENT\" };\n}\n\n/**\n * Envelope every report: the boundary is part of the payload itself, so any\n * consumer quoting the report quotes the boundary with it.\n */\nfunction envelope(report, extra = {}) {\n  return {\n    sdk: \"coreguard-dde-sdk\",\n    ddeVersion: DDE_VERSION,\n    boundary: BOUNDARY_BANNER.statement,\n    boundaryCode: BOUNDARY_BANNER.code,\n    ...extra,\n    ...report,\n  };\n}\n\n/**\n * Verify a fixture from an in-memory object or a directory of records.\n *\n * @param {object} opts\n * @param {object} [opts.fixture] fixture object (records at their engine keys)\n * @param {string} [opts.fixtureDir] directory of record JSON files\n * @param {object} [opts.evm] optional EVM adapter for consent replay (E5);\n *        absent → E5 NOT_RUN (never fabricated)\n * @param {boolean} [opts.peoplesCourt=false] include the evidence-class projection\n * @returns {Promise<object>} boundary-stamped verification report\n */\nexport async function verifyFixture({ fixture = undefined, fixtureDir = undefined, evm = undefined, peoplesCourt = false } = {}) {\n  let hashesManifest = \"NOT_PROVIDED\";\n  if (fixtureDir !== undefined) {\n    const loaded = loadFixtureFromDir(fixtureDir);\n    fixture = loaded.fixture;\n    hashesManifest = loaded.hashesManifest;\n  }\n  if (!fixture || typeof fixture !== \"object\") {\n    return envelope({\n      status: \"REJECTED\",\n      decision: \"FIXTURE_REJECTED\",\n      error: \"no fixture provided — pass `fixture` (object) or `fixtureDir` (directory of records)\",\n      checks: [],\n      summary: { total: 0, pass: 0, fail: 1, notRun: 0 },\n    });\n  }\n  const report = await verifyDeliveryFixture(fixture, evm);\n  const pc = peoplesCourt ? mapToPeoplesCourt(fixture) : undefined;\n  return envelope(report, {\n    hashesManifest,\n    peoplesCourt: pc,\n  });\n}\n\n/**\n * Payment-gate helper: turn a report into an explicit release/hold decision\n * with named reasons. The predicate is YOUR acceptance condition — the SDK\n * only enforces that no release can be decided by execution facts alone:\n * a gate that releases without the report being VERIFIED is refused\n * structurally (fail-closed), regardless of the predicate.\n *\n * @param {object} report envelope from verifyFixture()\n * @param {(report: object) => boolean} predicate platform's release condition\n * @returns {{ release: boolean, reasons: string[] }}\n */\nexport function releaseWhen(report, predicate) {\n  const reasons = [];\n  if (!report || report.status !== \"VERIFIED\") {\n    reasons.push(`fixture verification is ${report?.status ?? \"ABSENT\"} — no release without a VERIFIED report`);\n  }\n  if (typeof predicate !== \"function\") {\n    reasons.push(\"no release predicate provided — release requires an explicit acceptance condition\");\n  }\n  if (reasons.length === 0) {\n    let ok = false;\n    try { ok = predicate(report) === true; } catch (e) { reasons.push(`predicate error: ${e.message}`); }\n    if (!ok) reasons.push(\"release predicate not satisfied — the acceptance condition did not hold\");\n  }\n  return { release: reasons.length === 0, reasons };\n}\n","__shim__/crypto.mjs":"/* node:crypto shim — real SHA-256 (browser); created by inject-demo-data.mjs.\n   Cross-checked against node:crypto at injection time; injection fails closed\n   on any vector mismatch. Only the surface the engine uses is provided. */\nconst K = new Uint32Array([\n  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,\n  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,\n  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,\n  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,\n  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,\n  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,\n  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,\n  0x7 ath.floor(this._len / 2**32) * 8 + Math.floor((this._len % 2**32) * 8 / 2**32);\n    const totalLen = this._len + 9;\n    const paddedLen = Math.ceil(totalLen / 64) * 64;\n    const pad = new Uint8Array(paddedLen - this._len);\n    pad[0] = 0x80;\n    const dv = new DataView(pad.buffer);\n    dv.setUint32(pad.length - 8, bitHi >>> 0);\n    dv.setUint32(pad.length - 4, bitLo >>> 0);\n    this.update(pad);\n    return Array.from(this.h).map((x) => (x >>> 0).toString(16).padStart(8, \"0\")).join(\"\");\n  }\n  digest(enc) { const h = this.hex(); return enc === \"hex\" ? h : new Uint8Array(h.match(/../g).map((b) => parseInt(b, 16))); }\n}\nexport function createHash(alg) {\n  if (alg !== \"sha256\") throw new Error(\"browser shim: only sha256 (engine surface)\");\n  return new Sha256();\n}\n","__shim__/http.mjs":"/* node:http shim — created by inject-demo-data.mjs.\n   Surface = exactly what packages/delivery/http.js consumes in the page:\n   createServer (import must link; never called in-page — the page drives the\n   request handler directly) and Buffer (NOT a browser global; the handler\n   needs Buffer.concat(...).toString(\"utf8\") to drain request bodies).\n   CRITICAL: static concat must return a real Buffer INSTANCE — a plain\n   Uint8Array would hit Uint8Array.prototype.toString (radix semantics) and\n   emit comma-separated decimal bytes instead of text. */\nconst _bodyTd = new TextDecoder();\nexport class Buffer extends Uint8Array {\n  static concat(list) {\n    const parts = Array.from(list, (b) => (b instanceof Uint8Array ? b : new Uint8Array(b)));\n    const total = parts.reduce((n, a) => n + a.length, 0);\n    const out = new this(total);\n    let off = 0;\n    for (const a of parts) { out.set(a, off); off += a.length; }\n    return out;\n  }\n  toString(enc) {\n    if (enc === undefined || enc === \"utf8\" || enc === \"utf-8\") return _bodyTd.decode(this);\n    throw new Error(`browser Buffer shim: unsupported encoding ${enc} (handler surface is utf8)`) /* ========================================================= embedded SDK
   The REAL packages/delivery/sdk.js runs in this page over four micro-shims:
   - node:crypto — a real SHA-256 (cross-checked against node:crypto at
     injection time; injection fails closed on any vector mismatch).
   - node:fs — fail-closed: the page drives the in-memory path only, so
     existsSync() is false and readFileSync throws by design.
   - node:path / node:url — string-level helpers (join/dirname/fileURLToPath)
     sufficient for sdk.js's top-level HERE derivation on a blob: URL.
   - node:http — Buffer only (the engine hashes artifacts through the bare
     Buffer global; browsers have none). Bound as a global BEFORE the engine
     import — the same order the API-reference page is contracted on. */
const ENGINE_READY = (async () => {
  const D = window.__DDE_SDK_DATA__;
  if (!D || !D.sources) throw new Error("injected payload missing (run inject-demo-data.mjs)");

  // --- module registry: shims first, then the real sources with their
  // node:/bare/relative specifiers rewritten to blob URLs.
  const mods = {};
  const define = (name, src) => {
    const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
    mods[name] = url;
    return url;
  };
  define("node:crypto", D.sources["__shim__/crypto.mjs"]);
  define("node:fs", D.sources["__shim__/fs.mjs"]);
  // path and url share one string-level shim — both specifiers map to it.
  define("node:path", D.sources["__shim__/path.mjs"]);
  define("node:url", D.sources["__shim__/path.mjs"]);
  const httpShimUrl = define("node:http", D.sources["__shim__/http.mjs"]);

  // Buffer is a global on Node and absent in browsers — bind it exactly where
  // Node would have it, BEFORE any engine import (a ReferenceError here would
  // be swallowed inside the engine and surface as a wrong verdict).
  globalThis.Buffer = globalThis.Buffer || (await import(httpShimUrl)).Buffer;

  const rewrite = (src) => src
    .replaceAll('from "node:crypto"', `from ${JSON.stringify(mods["node:crypto"])}`)
    .replaceAll('import("node:crypto")', `import(${JSON.stringify(mods["node:crypto"])})`)
    .replaceAll('from "node:fs"', `from ${JSON.stringify(mods["node:fs"])}`)
    .replaceAll('from "node:path"', `from ${JSON.stringify(mods["node:path"])}`)
    .replaceAll('from "node:url"', `from ${JSON.stringify(mods["node:url"])}`)
    // delivery/index.js imports its canonical dependency BARE — a browser has
    // no node_modules walk, so this mapping is what makes the engine link
    // in-page (the pages-boot contract test asserts it).
    .replaceAll('from "@coreguard/canonical"', `from ${JSON.stringify(mods["__canonical__"])}`)
    // sdk.js imports its sibling index.js relatively — a blob module would
    // resolve that against the blob URL and fail to fetch.
    .replaceAll('from "./index.js"', `from ${JSON.stringify(mods["__delivery__"])}`);

  define("__canonical__", rewrite(D.sources["packages/canonical/index.js"]));
  define("__delivery__", rewrite(D.sources["packages/delivery/index.js"]));
  const sdkUrl = define("__sdk__", rewrite(D.sources["packages/delivery/sdk.js"]));

  const mod = await import(sdkUrl);
  const { createHash } = await import(mods["node:crypto"]);
  return { verifyFixture: mod.verifyFixture, releaseWhen: mod.releaseWhen, createHash };
})();

  r.peoplesCourt.items.some((i) => i.kind === "ACCEPTANCE_RECORD" && i.ref === "ACCEPTED");

/* --------------------------------------------------------------- variants */
let FD = null;            // embedded fixture (honest baseline)
let SDK = null;           // the booted module surface { verifyFixture, releaseWhen, createHash }
let CAPTURES = {};        // scenario → { report, gate }
let selected = null;

function esc(s){ return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;"); }

function variantFixture(sc) {
  if (sc === "verify" || sc === "misuse") return FD;                       // honest baseline
  if (sc === "tamper") {
    const f = JSON.parse(JSON.stringify(FD));
    f.delivery.artifacts[0].content = f.delivery.artifacts[0].content.replace("</svg>", "<X/svg>");
    return f;
  }
  if (sc === "accepted") {
    // The honest acceptance arc: satisfy the missing criterion, re-pin the
    // artifact over the exact new bytes (integrity must stay true — never a
    // dodge), let the criteria genuinely pass, record the ACCEPTED verdict.
    const f = JSON.parse(JSON.stringify(FD));
    const a = f.delivery.artifacts[1];
    a.content = a.content.replace("- Surface: #0d1b2a\n", "- Surface: #0d1b2a\n- Accent: #f4f7fa\n");
    a.bytes = new TextEncoder().encode(a.content).length;
    a.sha256 = "0x" + SDK.createHash("sha256").update(a.content, "utf8").digest("hex");
    for (const e of f.acceptanceRecord.evaluations) e.result = "PASS";
    f.acceptanceRecord.verdict = "ACCEPTED";
    return f;
  }
  throw new Error("unknown scenario: " + sc);
}

async function runCapture(sc) {
  const { verifyFixture, releaseWhen } = SDK;
  if (sc === "misuse") {
    // The misuse proof: a REJECTED (tampered) report handed to a LYING
    // predicate — the SDK's structural refusal fires regardless.
    const report = await verifyFixture({ fixture: variantFixture("tamper") });
    const gate = releaseWhen(report, () => true);
    return { report, gate };
  }
  const report = await verifyFixture({ fixture: variantFixture(sc), peoplesCourt: true });
  const gate = releaseWhen(report, ACCEPTANCE_PREDICATE);
  return { report, gate };
}

/* ------------------------------------------------------------ page views */
const SCENARIOS = ["verify", "accepted", "tamper", "misuse"];
const WHEN = {
  verify:   "sc_verify_when",
  accepted: "sc_accepted_when",
  tamper:   "sc_tamper_when",
  misuse:   "sc_misuse_when",
};
const NAME = {
  verify:   "sc_verify",
  accepted: "sc_accepted",
  tamper:   "sc_tamper",
  misuse:   "sc_misuse",
};

function gateChip(sc) {
  const c = CAPTURES[sc];
  if (!c) return `<span class="v-mid">…</span>`;
  const { report, gate } = c;
  const label = gate.release ? I18N.gate_release : (report.status === "VERIFIED" ? I18N.gate_hold : I18N.gate_refused);
  const cls = gate.release ? "v-ok" : (report.status === "VERIFIED" ? "v-mid" : "v-bad");
  return `<span class="${cls}">${esc(L(label))}</span>`;
}

function renderTable() {
  const tb = document.getElementById("scBody");
  tb.innerHTML = SCENARIOS.map((sc) => {
    const c = CAPTURES[sc];
    const verdict = c ? `${esc(c.report.status)}${c.report.decision ? " · " + esc(c.report.decision.split(" — ")[1] || c.report.decision) : ""}` : `<span class="v-mid">…</span>`;
    return `
    <tr data-sc="${sc}" class="${selected === sc ? "sel" : ""}">
      <td class="mono ltr">${esc(L(I18N[NAME[sc]]))}</td>
      <td class="mono ltr">${verdict}</td>
      <td>${gateChip(sc)}</td>
      <td><button class="btn" data-run="${sc}">▶</button></td>
    </tr>`;
  }).join("");
}

function renderDetail() {
  const h = document.querySelector("#scDetail h3");
  const pre = document.getElementById("scDetailPre");
  const note = document.getElementById("scDetailNote");
  const cap = selected && CAPTURES[selected];
  if (!cap) {
    h.setAttribute("data-i18n", "detail_empty"); h.innerHTML = L(I18N.detail_empty);
    pre.style.display = "none"; note.textContent = ""; return;
  }
  h.removeAttribute("data-i18n");
  h.textContent = L(I18N[NAME[selected]]) + " — " + cap.report.status + " · " + (cap.gate.release ? L(I18N.gate_release) : L(I18N.gate_hold));
  pre.style.display = "block";
  pre.textContent = JSON.stringify({ report: cap.report, gate: cap.gate }, null, 2);
  note.innerHTML = `<a href="#playground" data-run-live="${esc(selected)}">${esc(L(I18N.detail_run))}</a>`;
}

/* ------------------------------------------------------------------- boot */
async function main() {
  applyStatic();
  const boot = document.getElementById("boot");
  const D = window.__DDE_SDK_DATA__;
  FD = D && D.fixture;
  if (!FD) { boot.textContent = L(I18N.boot_fail) + "payload missing"; return; }
  try {
    SDK = await ENGINE_READY;
    for (const sc of SCENARIOS) CAPTURES[sc] = await runCapture(sc);
    document.getElementById("out").style.display = "none";   // hide boot captures
    boot.textContent = L(I18N.boot_ok);
    boot.removeAttribute("data-i18n");   // keep the live status across language flips
  } catch (err) {
    boot.textContent = L(I18N.boot_fail) + err.message;      // honest fallback
  }
  renderTable(); renderDetail();

  /* --- #run=<scenario> hash, processed AFTER the boot re-render so a deep
     link's selection survives the boot pass — and AFTER SDK is resolved, so
     the rerun it triggers actually has the SDK in hand ([C24] sibling: a
     block that races its own boot state is a control nobody clicked). */
  const runHash = (location.hash || "").match(/^#run=([a-z]+)$/);
  if (runHash) {
    const sc = runHash[1];
    if (SCENARIOS.includes(sc)) {
      selected = sc;
      renderTable(); renderDetail();
      document.getElementById("playground").scrollIntoView({ behavior: "smooth" });
      rerun(sc);
    }
  }

  document.getElementById("scBody").addEventListener("click", (e) => {
    const run = e.target.closest("button[data-run]");
    if (run) { rerun(run.getAttribute("data-run")); return; }
    const tr = e.target.closest("tr[data-sc]");
    if (tr) { selected = tr.getAttribute("data-sc"); renderTable(); renderDetail(); }
  });
  document.getElementById("scDetailNote").addEventListener("click", (e) => {
    const live = e.target.closest("[data-run-live]");
    if (live) rerun(live.getAttribute("data-run-live"));
  });
  document.getElementById("langBtn").onclick = () => {
    window.cgLang = window.cgLang === "en" ? "ar" : "en";
    applyStatic();
    renderTable(); renderDetail();
    document.dispatchEvent(new CustomEvent("cg41:lang", { detail: { lang: window.cgLang } }));
  };
}

async function rerun(sc) {
  const out = document.getElementById("out");
  out.style.display = "block";
  out.textContent = L(I18N.out_pending);
  try {
    CAPTURES[sc] = await runCapture(sc);
    selected = sc;
    const { report, gate } = CAPTURES[sc];
    out.textContent = "status: " + report.status + "\ndecision: " + report.decision +
      "\ngate.release: " + gate.release +
      (gate.reasons.length ? "\ngate.reasons:\n  - " + gate.reasons.join("\n  - ") : "\ngate.reasons: none") +
      "\n\n" + JSON.stringify(CAPTURES[sc], null, 2);
  } catch (err) {
    out.textContent = L({en:"probe failed: ",ar:"فشل المسبار: "}) + err.message;
  }
  renderTable(); renderDetail();
}

main();
</script>
